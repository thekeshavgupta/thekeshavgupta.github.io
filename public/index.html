<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#090b10" />
  <meta name="description" content="Keshav Gupta — Software Engineer with 6 years experience building scalable microservices, distributed systems, and AI/ML architectures. Ex-Microsoft, Ex-Amazon. M.S. AI UT Austin." />
  <meta name="keywords" content="Keshav Gupta, Software Engineer, Microsoft, Amazon, UT Austin, Distributed Systems, PyTorch, Artificial Intelligence, Machine Learning" />
  <meta name="author" content="Keshav Gupta" />

  <!-- Open Graph / Meta -->
  <meta property="og:title" content="Keshav Gupta — Software Engineer & AI Researcher" />
  <meta property="og:description" content="Building intelligent, high-scale distributed systems. Ex-Microsoft, Ex-Amazon. M.S. AI from UT Austin." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://thekeshavgupta.github.io" />

  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('kg_theme');
        var theme = savedTheme === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
        var metaTheme = document.querySelector('meta[name="theme-color"]');
        if (metaTheme) {
          metaTheme.setAttribute('content', theme === 'dark' ? '#090b10' : '#f8fafc');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8SNQF0R2XM"></script>

    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-8SNQF0R2XM');
  </script>

  <!-- Preconnect and Google Fonts: Plus Jakarta Sans, Outfit, Roboto Mono -->
